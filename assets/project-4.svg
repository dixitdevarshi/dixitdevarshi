<svg xmlns="http://www.w3.org/2000/svg" width="620" height="250" viewBox="0 0 620 250">
<style>
.card{fill:#ffffff;stroke:#d1d9e0}
.title{fill:#1f2328;font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.body{fill:#59636e;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.metric{fill:#1f2328;font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.stack{fill:#168f89;font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.link{fill:#59636e;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.rule{stroke:#d1d9e0}
@media (prefers-color-scheme:dark){
.card{fill:#0d1117;stroke:#3d444d}
.title,.metric{fill:#f0f6fc}
.body,.link{fill:#9198a1}
.stack{fill:#3AAFA9}
.rule{stroke:#3d444d}
}
</style>
<rect class="card" x="1" y="1" width="618" height="248" rx="12"/>
<text class="title" x="28" y="48">RoboJEC</text>
<text class="stack" x="28" y="78">Whisper · Claude · Voice AI</text>
<line class="rule" x1="28" y1="101" x2="592" y2="101"/>
<text class="body" x="28" y="132">Real-time conversational voice AI with a custom quality evaluation</text>
<text class="body" x="28" y="156">framework.</text>
<text class="metric" x="28" y="207">IEEE ICCCMLA 2025</text>
<text class="link" x="592" y="224" text-anchor="end">View repository →</text>
</svg>